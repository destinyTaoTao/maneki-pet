# 由用户显式加载。两个路径都须指向本机的绝对路径。
- insert:
    - id: maneki-briefing
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: maneki
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js process.env.MANEKI_BRIEFING_BRIDGE
        env:
          MANEKI_RUNTIME_URL: !!js process.env.MANEKI_BRIEFING_URL || 'http://127.0.0.1:18100'
          MANEKI_BRIEFING_TOKEN_FILE: !!js process.env.MANEKI_BRIEFING_TOKEN_FILE
